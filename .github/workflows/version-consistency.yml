name: Version consistency

on:
  push:
  pull_request:

jobs:
  check-version:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Verify synchronized version surfaces
        run: npm run version:check
